kind = "web"
previewPath = "/"
title = "Digital Twin App"
version = "1.0.0"
id = "artifacts/digital-twin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22866

[services.development]
run = "pnpm --filter @workspace/digital-twin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-twin", "run", "build" ]
publicDir = "artifacts/digital-twin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22866"
BASE_PATH = "/"
